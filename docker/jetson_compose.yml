services:
  isaac_ros:
    image: jetson/ros-realsense:humble-r36.4
    container_name: jetson_ros_realsense
    runtime: nvidia
    shm_size: 8g
    privileged: true
    stdin_open: true
    tty: true
    environment:
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,graphics   # add graphics for GUI
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1                                    # avoids MIT-SHM issues
    volumes:
      - ../ros_ws:/ros_ws:rw
      - /dev/bus/usb:/dev/bus/usb
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /tmp/.X11-unix:/tmp/.X11-unix                         # <-- X socket
    devices:
      - /dev/dri:/dev/dri                                              # optional, helps GL paths
      - /dev/snd:/dev/snd
      - /dev/ttyTHS1:/dev/ttyTHS1
      - /dev/ttyUSB0:/dev/ttyUSB0
      - /dev/ttyUSB1:/dev/ttyUSB1
    group_add:
      - "dialout"
      - "video"
