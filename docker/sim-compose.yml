version: '3.8'

services:
  gazebo_sim:
    build:
      context: .
      dockerfile: sim-dockerfile
    container_name: uwf_gazebo_sim
    privileged: true
    network_mode: host
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ../sim_ws:/root/sim_ws:rw
      - /dev:/dev:rw
    runtime: nvidia
    stdin_open: true
    tty: true
    command: /bin/bash
