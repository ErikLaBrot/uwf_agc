controller_manager:
  ros__parameters:
    update_rate: 100
    
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    
    # Single steering controller for the INPUT joint
    steering_controller:
      type: effort_controllers/JointGroupEffortController
    
    # Drive controllers for rear wheels
    rear_drive_controller:
      type: effort_controllers/JointGroupEffortController

# Controller configurations
steering_controller:
  ros__parameters:
    joints:
      - steering_input_joint

rear_drive_controller:
  ros__parameters:
    joints:
      - rear_left_wheel_joint
      - rear_right_wheel_joint